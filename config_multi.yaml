# ============================================================
# CONFIG CHUYÊN BIỆT - HUẤN LUYỆN GLiNER-Multi
# ============================================================

run:
  train_gliner: true          # Chỉ chạy train GLiNER
  train_classifier: false     # Tắt Level Classifier
  run_benchmark: false        # Tắt benchmark Classifier
  run_benchmark_gliner: false # Tắt benchmark GLiNER
  seed: 42

# ============================================================
# DATASET
# ============================================================
data:
  dataset_path: "../cleaned_dataset.json"   # Đường dẫn tương đối hoạt động tốt trên cả Kaggle và Local
  val_ratio: 0.2                            # Tỉ lệ validation (20% để chia đôi: 10% val / 10% test)
  max_samples: null                         # null = dùng toàn bộ dữ liệu

# ============================================================
# GLiNER CONFIG
# ============================================================
gliner:
  # Base model: Phiên bản Multi v2.1 dùng encoder XLM-RoBERTa-base (270M params)
  model_name: "urchade/gliner_multi-v2.1"

  entity_types:
    - "SKILL"
    - "EXPERIENCE"

  # Hyperparameters tối ưu tránh lỗi CUDA OOM trên GPU <= 16GB và học đầy đủ
  num_epochs: 8                   # Tăng lên 8 epoch để mô hình hội tụ tốt
  train_batch_size: 2             # Giảm xuống 2 để tránh OOM
  eval_batch_size: 2
  learning_rate: 3.0e-5           # LR thấp hơn cho mô hình lớn
  weight_decay: 0.01
  warmup_ratio: 0.15              # Tăng warmup lên 15% cho mô hình lớn ổn định hơn
  max_length: 512                 # Độ dài max token 512
  max_neg_type_ratio: 1
  gradient_accumulation_steps: 8  # Tích lũy gradient lên 8 (Effective batch size = 16)
  gradient_checkpointing: true    # Bật gradient checkpointing giúp giảm tiêu thụ bộ nhớ
  early_stopping_patience: 3      # Độ kiên nhẫn khi dừng sớm (null để tắt)

  # Cấu hình lưu trữ và logs
  output_dir: "./outputs/gliner_multi"
  save_steps: 200                 # Đánh giá mịn hơn để vẽ đồ thị chi tiết
  eval_steps: 200
  save_total_limit: 1             # Chỉ giữ lại 1 checkpoint mới nhất để tránh tràn ổ đĩa
  save_only_model: true           # Chỉ lưu model weight, bỏ qua trạng thái optimizer
  logging_steps: 50
  wandb_project: null             # null = tắt logging Weights & Biases
